name: SaaS API tests
on:
  push:
    paths:
      - 'saas-api/**'
      - 'web-local/saas.js'
      - '.github/workflows/saas-api-ci.yml'
  pull_request:
    paths:
      - 'saas-api/**'
      - 'web-local/saas.js'
      - '.github/workflows/saas-api-ci.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: autoclips_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:testpass@127.0.0.1:5432/autoclips_test
      PYTHONPATH: saas-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compile Python and browser connector
        run: |
          python -m py_compile saas-api/core.py saas-api/main.py saas-api/worker.py
          node --check web-local/saas.js
      - name: Install pinned dependencies
        run: python -m pip install -r saas-api/requirements-dev.txt
      - name: Create private schema on temporary Postgres
        run: |
          python - <<'PY'
          import os, psycopg
          with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
              conn.execute("create role anon")
              conn.execute("create role authenticated")
              with open("saas-api/schema.sql", encoding="utf-8") as f:
                  conn.execute(f.read())
          print("Schema created in test container")
          PY
      - name: Run tenant, wallet and Stripe ledger tests
        run: python -m pytest -q saas-api/tests/
