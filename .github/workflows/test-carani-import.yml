name: AutoClips Real Cariani End-to-End
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  render-authenticated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout AutoClips code
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install AutoClips media dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install -U pytest 'faster-whisper>=1.1,<2' 'av>=11,<19'
      - name: Fetch authorized full original into AutoClips
        env:
          AUTOCLIPS_HOME: ${{ runner.temp }}/autoclips
          AUTOCLIPS_SOURCE_URL: ${{ secrets.AUTOCLIPS_DEMO_SOURCE_URL }}
        run: |
          python - <<'PY'
          from autoclips.media import import_hosted_approved, probe
          import os
          url = os.environ['AUTOCLIPS_SOURCE_URL']
          file = import_hosted_approved(url, 'cariani_2026', True)
          info = probe(file)
          print('AUTOCLIPS_DOWNLOAD_SUCCESS', file.stat().st_size, info)
          assert 355 < info['duration'] < 365 and info['width'] >= 720
          PY
      - name: Generate transcript and edit ORIGINAL MP4 with AutoClips
        env:
          AUTOCLIPS_HOME: ${{ runner.temp }}/autoclips
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request
          from pathlib import Path
          import os
          from autoclips.media import probe
          from autoclips.split_renderer import render_split
          root=Path(os.environ['AUTOCLIPS_HOME'])
          video=root/'projects'/'cariani_2026'/'source.mp4'
          out=Path('AutoClips_Cariani_casamento_contexto.mp4').resolve()
          start,end=8.0,88.0
          image=root/'cariani_tati.jpg'
          try:
              urllib.request.urlretrieve('https://i.ytimg.com/vi/6byBqwVBgek/hqdefault.jpg',image)
              print('AUTOCLIPS_IMAGE_FOUND',image.stat().st_size)
          except Exception as exc:
              print('AUTOCLIPS_IMAGE_FALLBACK',type(exc).__name__)
              image=None
          audio=root/'cariani_voice.wav'
          subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-ss',str(start),'-t',str(end-start),
              '-i',str(video),'-ac','1','-ar','16000','-vn',str(audio)],check=True)
          from faster_whisper import WhisperModel
          model=WhisperModel('tiny',device='cpu',compute_type='int8')
          segments,info=model.transcribe(str(audio),language='pt',word_timestamps=True,beam_size=3)
          words=[]
          for s in segments:
              for w in (s.words or []):
                  if w.start is not None and w.end is not None and w.end>w.start:
                      words.append({'start':start+w.start,'end':start+w.end,'text':w.word.strip()})
          print('AUTOCLIPS_TRANSCRIPT_WORDS',len(words),'language',info.language)
          if len(words)<30: raise RuntimeError('transcription did not find sufficient words')
          result=render_split(source=video,words=words,start=start,end=end,output=out,
              image=image,focal_x=0.55,size=(720,1280),
              hook_white='APOSTARAM QUE ELE',hook_red='NÃO IA CASAR')
          print('AUTOCLIPS_RENDER_COMPLETE',json.dumps(result))
          assert out.stat().st_size>100_000
          info=probe(out)
          print('AUTOCLIPS_FINAL_PROBE',json.dumps(info))
          assert abs(info['duration']-(end-start))<1.5
          assert info['width']==720 and info['height']==1280
          PY
      - name: Upload real output MP4
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AutoClips-Cariani-80s-Video-Real
          path: AutoClips_Cariani_casamento_contexto.mp4
          retention-days: 7
          if-no-files-found: error
