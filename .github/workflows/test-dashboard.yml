name: ClipCon dashboard integration tests
on:
  workflow_dispatch:
  push:
    paths:
      - "autoclips/dashboard.py"
      - "autoclips/media.py"
      - "pyproject.toml"
      - "tests/test_video_ingest.py"
      - "autoclips/publish_queue.py"
      - "autoclips/demo_ingest.py"
      - "dashboard.html"
      - "cloud_server.py"
      - "autoclips/cloud_auth.py"
      - "tests/test_dashboard.py"
      - ".github/workflows/test-dashboard.yml"
permissions:
  contents: read
jobs:
  validate-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg for real MP4 upload regression test
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Install unit test support
        run: python -m pip install -q "pytest>=8" "starlette>=0.45,<1" "httpx>=0.27" "cryptography>=43,<47" "PyJWT[crypto]>=2.9,<3"
      - name: Check syntax
        run: python -m compileall -q autoclips cloud_server.py server.py
      - name: Check dashboard and publication rules
        run: python -m pytest -q tests/test_dashboard.py tests/test_youtube_oauth_web.py tests/test_video_ingest.py
