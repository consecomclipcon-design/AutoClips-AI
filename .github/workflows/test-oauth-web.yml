name: AutoClips Google OAuth Web tests
on:
  workflow_dispatch:
  push:
    paths:
      - "autoclips/oauth_web.py"
      - "autoclips/youtube.py"
      - "autoclips/cloud_auth.py"
      - "cloud_server.py"
      - "tests/test_youtube_oauth_web.py"
      - ".github/workflows/test-oauth-web.yml"
permissions:
  contents: read
jobs:
  oauth-web-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install minimal test dependencies
        run: python -m pip install pytest 'cryptography>=43,<47'
      - name: Syntax verification
        run: python -m compileall -q autoclips cloud_server.py server.py
      - name: Offline OAuth and gateway safety tests
        run: python -m pytest -q tests/test_youtube_oauth_web.py
