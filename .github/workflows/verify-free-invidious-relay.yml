name: Verify trusted free Invidious video relays (non-production)
on:
  push:
    paths: [".github/workflows/verify-free-invidious-relay.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe official-listed Invidious servers and actual video data
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python3 - <<'PY'
          import json, urllib.request, urllib.parse, urllib.error
          import ssl, socket
          VIDEO="NmjiNtvSkFk"
          HOSTS=["inv.nadeko.net","invidious.nerdvpn.de",
                 "yt.chocolatemoo53.com","invidious.tiekoetter.com"]
          # Only official-listed community hosts; no arbitrary URL is accepted.
          opener=urllib.request.build_opener()
          for host in HOSTS:
              api=f"https://{host}/api/v1/videos/{VIDEO}"
              request=urllib.request.Request(api,headers={
                  "User-Agent":"AutoClips/1.0 (research-only one video metadata test)",
                  "Accept":"application/json"})
              try:
                  with opener.open(request,timeout=12) as r:
                      status=r.status
                      media=r.headers.get("Content-Type","")
                      body=r.read(400000)
                  if status!=200 or "json" not in media:
                      print("INSTANCE",host,"NO_JSON_RESPONSE",status,media[:60]);continue
                  data=json.loads(body)
                  if data.get("videoId") != VIDEO:
                      print("INSTANCE",host,"WRONG_VIDEO_OR_ERROR",str(data.get("error",""))[:80]);continue
                  streams=data.get("formatStreams") or []
                  print("INSTANCE",host,"METADATA_OK","streams",len(streams),"duration",data.get("lengthSeconds"))
                  if not streams:
                      continue
                  # TEST the instance's OWN bounded proxy, not external Google streaming URLs.
                  proxy=f"https://{host}/latest_version?id={VIDEO}&itag=18&local=true"
                  req=urllib.request.Request(proxy,headers={
                      "User-Agent":"AutoClips/1.0 (research-only media range probe)",
                      "Range":"bytes=0-131071"})
                  with opener.open(req,timeout=18) as r:
                      ct=r.headers.get("Content-Type","")
                      status=r.status
                      chunk=r.read(131072)
                  valid=("video/" in ct or "application/octet-stream" in ct) and len(chunk)>2048
                  print("INSTANCE",host,"MEDIA_RESULT","HTTP",status,"content-type",ct[:50],
                        "bytes",len(chunk),"video_signature",chunk[4:8]==b"ftyp","valid",valid)
                  if valid:
                      print("FREE_RELAY_PARTIAL_STREAM_CONFIRMED",host)
                      break
              except Exception as e:
                  print("INSTANCE",host,"FAILED",type(e).__name__,
                        str(e)[:100].replace("\n"," "))
          else:
              print("RESULT: NO_TRUSTED_FREE_RELAY_PROVED_WORKING")
          PY
