name: Web-local media integration
on:
  workflow_dispatch:
  push:
    branches:
      - feat/browser-local-poc-20261122
    paths:
      - 'web-local/**'
      - '.github/workflows/web-local-media.yml'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
      - name: Create synthetic media fixture (not an editorial validation)
        run: |
          ffmpeg -hide_banner -loglevel error -y \
            -f lavfi -i "testsrc2=size=640x360:rate=24" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" \
            -t 4 -c:v libx264 -preset ultrafast -pix_fmt yuv420p \
            -c:a aac -b:a 96k /tmp/autoclips-fixture.mp4
      - name: Start static web app and export one clip
        run: |
          python3 -m http.server 8080 --bind 127.0.0.1 --directory web-local >/tmp/web-local.log 2>&1 &
          sleep 2
          node web-local/e2e.mjs
      - name: Verify export and normalize final MP4 when needed
        env:
          PYTHONPATH: saas-api
          ALLOW_SERVER_CODEC_FALLBACK: '1'
        run: |
          python -m pip install -r saas-api/requirements.txt
          python - <<'PY'
          from glob import glob
          import hashlib, os, subprocess
          from worker import verify_media, normalize_media
          candidates = glob('/tmp/autoclips-fixture-*.mp4')
          assert len(candidates) == 1, candidates
          path = candidates[0]
          with open(path,'rb') as stream:
              sha = hashlib.sha256(stream.read()).hexdigest()
          info = verify_media(path, sha, os.stat(path).st_size)
          print('Browser MP4 codecs:', info['video_codec'], info['audio_codec'])
          result = normalize_media(path, info, '/tmp')
          print('YouTube-ready final file:', result)
          for kind, expected in [('v:0','h264'), ('a:0','aac')]:
              codec = subprocess.check_output(
                  ['ffprobe','-v','error','-select_streams',kind,
                   '-show_entries','stream=codec_name','-of',
                   'default=noprint_wrappers=1:nokey=1',result],text=True
              ).strip()
              assert codec == expected, (kind,codec)
          dims = subprocess.check_output(
              ['ffprobe','-v','error','-select_streams','v:0','-show_entries',
               'stream=width,height','-of','csv=s=x:p=0',result],text=True
          ).strip()
          assert dims == '540x960',dims
          PY
