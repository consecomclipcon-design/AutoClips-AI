name: Production web container
on:
  workflow_dispatch:
  push:
    paths:
      - 'web-local/Dockerfile'
      - 'web-local/nginx.conf.template'
      - 'web-local/entrypoint.sh'
      - 'web-local/saas-config.template.json'
      - 'web-local/vercel.json'
      - 'web-local/build-vercel.mjs'
      - 'web-local/index.html'
      - 'web-local/studio.css'
      - 'web-local/studio-ui.js'
      - '.github/workflows/web-prod-ci.yml'
  pull_request:
    paths:
      - 'web-local/Dockerfile'
      - 'web-local/nginx.conf.template'
      - 'web-local/entrypoint.sh'
      - 'web-local/saas-config.template.json'
      - '.github/workflows/web-prod-ci.yml'
jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate same Studio assets for Vercel
        working-directory: web-local
        run: |
          node build-vercel.mjs
          test -s dist/index.html
          test -s dist/studio.css
          test -s dist/studio-ui.js
          test -s dist/desktop-ui.css
          test -s dist/desktop-ui.js
          test -s dist/captions.js
          test -s dist/transcribe.js
          test -s dist/transcribe.worker.js
          test -s dist/saas-config.json
          node --check dist/studio-ui.js
          node --check dist/desktop-ui.js
          node --check dist/transcribe.js
          node --check dist/transcribe.worker.js
          node ../web-local/captions.test.mjs
          node -e 'const x=require("./dist/saas-config.json");if(x.apiUrl || x.googleClientId) process.exit(1)'
      - name: Build static Docker image
        run: docker build --file web-local/Dockerfile --tag autoclips-zero-media:ci .
      - name: Run with public TEST configuration only
        run: |
          docker run --rm --detach --name autoclips-zero-media-test \
            -p 127.0.0.1:18080:8080 \
            -e API_URL=https://api.example.com \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=sb_publishable_testnotsecret \
            -e GOOGLE_CLIENT_ID=123456789-test.apps.googleusercontent.com \
            autoclips-zero-media:ci
          sleep 3
          curl -fsS http://127.0.0.1:18080/health
          curl -fsS http://127.0.0.1:18080/ | grep -q AutoClips
          curl -fsS http://127.0.0.1:18080/saas-config.json | grep -q 'https://api.example.com'
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'content-security-policy'
          curl -fsSI http://127.0.0.1:18080/ | grep -qi 'cross-origin-opener-policy'
          head -c 65536 /dev/zero > /tmp/not-allowed.mp4
          test "$(curl -sS -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: video/mp4' --data-binary @/tmp/not-allowed.mp4 http://127.0.0.1:18080/)" = "413"
          docker logs autoclips-zero-media-test
      - name: Stop container
        if: always()
        run: docker rm -f autoclips-zero-media-test || true
